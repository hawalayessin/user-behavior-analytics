name: Backend tests and frontend build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://analytics:test@localhost:5432/analytics_test
      SECRET_KEY: ci-only-signing-key-not-used-in-a-deployment
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: test
          POSTGRES_DB: analytics_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: user-analytics-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: user-analytics-backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0
      - run: pip install -r requirements-dev.txt
      - run: python scripts/init_demo_database.py --confirm-empty-demo --users 20
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-platform-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics-platform-front/package-lock.json
      - run: npm ci
      - run: npm run build
