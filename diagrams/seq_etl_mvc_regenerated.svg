<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f4f73"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f3554" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 34px Georgia, 'Times New Roman', serif; fill: #173e72; }
      .lane-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #111827; }
      .lane-sub { font: 600 16px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .label { font: 600 16px Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 600 14px Arial, Helvetica, sans-serif; fill: #111827; }
      .tiny { font: 600 13px Arial, Helvetica, sans-serif; fill: #111827; }
      .note { font: 600 14px Arial, Helvetica, sans-serif; fill: #173e72; }
      .lifeline { stroke: #111827; stroke-width: 1.7; stroke-dasharray: 6 5; }
      .activation { fill: #8fd3f4; stroke: #0f4f73; stroke-width: 2; }
      .arrow { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #0f4f73; stroke-width: 2.2; fill: none; marker-end: url(#arrowBlue); }
      .return { stroke: #111827; stroke-width: 2.2; fill: none; stroke-dasharray: 10 7; marker-end: url(#arrow); }
      .border { fill: #ffffff; stroke: #173e72; stroke-width: 2.4; }
      .header-dot { fill: #8fd3f4; stroke: #0f4f73; stroke-width: 2.4; }
      .loop { fill: #eff8ff; stroke: #173e72; stroke-width: 1.8; stroke-dasharray: 8 6; }
      .loop-title { fill: #ffffff; stroke: #173e72; stroke-width: 1.5; }
      .db { fill: #f7fbff; stroke: #0f4f73; stroke-width: 2; }
    </style>
  </defs>

  <rect x="6" y="6" width="1788" height="1028" rx="8" class="border"/>
  <text x="30" y="50" class="title">Diagramme de séquence MVC - Lancement du pipeline ETL</text>

  <!-- Participant positions -->
  <!-- x: admin 145, view 570, controller 1035, model 1505 -->

  <!-- Admin actor -->
  <circle cx="145" cy="82" r="10" class="header-dot"/>
  <line x1="145" y1="92" x2="145" y2="128" stroke="#111827" stroke-width="2.2"/>
  <line x1="120" y1="105" x2="170" y2="105" stroke="#111827" stroke-width="2.2"/>
  <line x1="145" y1="128" x2="120" y2="160" stroke="#111827" stroke-width="2.2"/>
  <line x1="145" y1="128" x2="170" y2="160" stroke="#111827" stroke-width="2.2"/>
  <text x="84" y="184" class="lane-title">Administrateur</text>

  <!-- View icon -->
  <line x1="500" y1="70" x2="500" y2="140" stroke="#111827" stroke-width="2.2"/>
  <line x1="500" y1="105" x2="548" y2="105" stroke="#111827" stroke-width="2.2"/>
  <circle cx="575" cy="105" r="23" class="header-dot"/>
  <text x="546" y="158" text-anchor="middle" class="lane-title">View</text>
  <text x="546" y="184" text-anchor="middle" class="lane-sub">(Interface Admin)</text>

  <!-- Controller icon -->
  <circle cx="1035" cy="105" r="23" class="header-dot"/>
  <path d="M1030 80 C1035 70, 1048 70, 1050 80" stroke="#111827" stroke-width="2" fill="none"/>
  <path d="M1030 80 L1040 76 L1038 86" stroke="#111827" stroke-width="2" fill="none"/>
  <line x1="1002" y1="128" x2="1068" y2="128" stroke="#111827" stroke-width="2.2"/>
  <text x="1035" y="158" text-anchor="middle" class="lane-title">Controller</text>
  <text x="1035" y="184" text-anchor="middle" class="lane-sub">(FastAPI Controller)</text>

  <!-- Model icon -->
  <circle cx="1505" cy="105" r="23" class="header-dot"/>
  <line x1="1450" y1="128" x2="1560" y2="128" stroke="#111827" stroke-width="2.2"/>
  <text x="1505" y="158" text-anchor="middle" class="lane-title">Model / Service</text>
  <text x="1505" y="184" text-anchor="middle" class="lane-sub">(ETL Runner + DB)</text>

  <!-- Lifelines -->
  <line x1="145" y1="195" x2="145" y2="1000" class="lifeline"/>
  <line x1="570" y1="195" x2="570" y2="1000" class="lifeline"/>
  <line x1="1035" y1="195" x2="1035" y2="1000" class="lifeline"/>
  <line x1="1505" y1="195" x2="1505" y2="1000" class="lifeline"/>

  <!-- Activation bars -->
  <rect x="137" y="210" width="16" height="740" class="activation"/>
  <rect x="562" y="224" width="16" height="726" class="activation"/>
  <rect x="1027" y="334" width="16" height="548" class="activation"/>
  <rect x="1497" y="458" width="16" height="286" class="activation"/>

  <!-- Main flow -->
  <line x1="153" y1="235" x2="558" y2="235" class="arrow"/>
  <text x="245" y="220" class="label">1 : Accéder au module ETL</text>

  <line x1="153" y1="304" x2="558" y2="304" class="arrow"/>
  <text x="250" y="288" class="label">2 : Cliquer sur "Run ETL pipeline"</text>

  <line x1="578" y1="354" x2="1023" y2="354" class="arrow"/>
  <text x="640" y="330" class="label">3 : POST /admin/import/run-etl</text>
  <text x="675" y="354" class="small">(mode, demo_users, truncate, dry_run)</text>

  <!-- Controller self operations -->
  <path d="M1043 385 H1088 V414 H1043" class="arrow"/>
  <text x="1102" y="392" class="small">3.1 : Vérifier JWT</text>
  <text x="1102" y="413" class="small">et rôle admin</text>

  <path d="M1043 445 H1088 V474 H1043" class="arrow"/>
  <text x="1102" y="458" class="small">3.2 : Valider les paramètres</text>

  <path d="M1043 505 H1088 V534 H1043" class="arrow"/>
  <text x="1102" y="514" class="small">3.3 : Créer ImportLog</text>
  <text x="1102" y="535" class="small">(status = running)</text>

  <!-- Launch ETL background -->
  <line x1="1043" y1="585" x2="1493" y2="585" class="arrow"/>
  <text x="1168" y="566" class="label">4 : Démarrer la tâche ETL en arrière-plan</text>

  <!-- ETL self operations -->
  <path d="M1513 615 H1562 V644 H1513" class="arrow"/>
  <text x="1576" y="623" class="small">4.1 : Extraire depuis prod_db</text>
  <path d="M1513 672 H1562 V701 H1513" class="arrow"/>
  <text x="1576" y="681" class="small">4.2 : Transformer et normaliser</text>
  <path d="M1513 729 H1562 V758 H1513" class="arrow"/>
  <text x="1576" y="738" class="small">4.3 : Charger dans</text>
  <text x="1576" y="759" class="small">analytics_db</text>
  <path d="M1513 786 H1562 V815 H1513" class="arrow"/>
  <text x="1576" y="795" class="small">4.4 : Enregistrer logs et métriques</text>

  <!-- Immediate response -->
  <line x1="1027" y1="633" x2="578" y2="633" class="return"/>
  <text x="700" y="608" class="label">5 : Réponse immédiate</text>
  <text x="672" y="632" class="small">{log_id, status: "running"}</text>

  <!-- Polling loop -->
  <rect x="520" y="666" width="600" height="194" rx="8" class="loop"/>
  <rect x="538" y="653" width="208" height="28" rx="5" class="loop-title"/>
  <text x="553" y="673" class="note">loop toutes les 2 secondes</text>

  <line x1="578" y1="704" x2="1023" y2="704" class="arrow-blue"/>
  <text x="642" y="690" class="small">6 : GET /run-etl/{log_id}/status</text>

  <line x1="1027" y1="742" x2="578" y2="742" class="return"/>
  <text x="666" y="728" class="small">7 : status, progression, étape courante</text>

  <line x1="578" y1="783" x2="1023" y2="783" class="arrow-blue"/>
  <text x="642" y="769" class="small">8 : GET /run-etl/{log_id}/log</text>

  <line x1="1027" y1="821" x2="578" y2="821" class="return"/>
  <text x="692" y="807" class="small">9 : lignes de log récentes</text>

  <!-- View self updates -->
  <path d="M562 880 H515 V908 H562" class="arrow"/>
  <text x="248" y="889" class="small">10.1 : Afficher la progression</text>
  <text x="248" y="910" class="small">et les logs en temps réel</text>

  <path d="M562 934 H515 V962 H562" class="arrow"/>
  <text x="248" y="943" class="small">10.2 : Afficher le résultat final</text>

  <line x1="562" y1="982" x2="153" y2="982" class="return"/>
  <text x="248" y="965" class="label">11 : Consulter le résultat d'exécution</text>

  <!-- Data stores note -->
  <g filter="url(#softShadow)">
    <rect x="1292" y="250" width="390" height="140" rx="8" class="db"/>
    <ellipse cx="1370" cy="284" rx="48" ry="14" class="db"/>
    <path d="M1322 284 V334 C1322 342, 1418 342, 1418 334 V284" class="db"/>
    <ellipse cx="1370" cy="334" rx="48" ry="14" class="db"/>
    <text x="1445" y="286" class="lane-title">Données ETL</text>
    <text x="1445" y="314" class="small">Source : prod_db</text>
    <text x="1445" y="338" class="small">Cible : analytics_db</text>
    <text x="1445" y="362" class="small">Audit : import_logs</text>
  </g>

  <!-- Footer hint -->
  <text x="30" y="1010" class="tiny" fill="#475569">Version régénérée : flux asynchrone FastAPI, suivi par polling status/log et historique ImportLog.</text>
</svg>
