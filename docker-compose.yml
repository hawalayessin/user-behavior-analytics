# Local development only; database and cache are isolated from production.
services:
  analytics_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analytics
      POSTGRES_DB: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - analytics_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [analytics_net]
  analytics_backend:
    build: ./user-analytics-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://analytics:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@analytics_postgres:5432/analytics
      ANALYTICS_CONN: postgresql+psycopg2://analytics:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@analytics_postgres:5432/analytics
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Local Demo Administrator}
      ADMIN_ROLE: admin
      REDIS_URL: redis://analytics_redis:6379/0
    depends_on:
      analytics_postgres:
        condition: service_healthy
      analytics_redis:
        condition: service_healthy
    ports: ["127.0.0.1:8000:8000"]
    networks: [analytics_net]
  analytics_frontend:
    build: ./analytics-platform-front
    environment:
      VITE_PROXY_TARGET: http://analytics_backend:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [analytics_backend]
    networks: [analytics_net]
  analytics_redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [analytics_net]
networks:
  analytics_net:
volumes:
  analytics_pg_data:
